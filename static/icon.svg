<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1420"/>
      <stop offset="1" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b85"/>
      <stop offset="1" stop-color="#e0294f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- three source tiles, fanned -->
  <g filter="url(#shadow)">
    <g transform="rotate(-14 200 210)">
      <rect x="70" y="120" width="230" height="140" rx="22" fill="#ff9900"/>
      <rect x="70" y="232" width="230" height="28" rx="0" fill="#000" opacity=".18"/>
    </g>
    <g transform="rotate(-2 230 220)">
      <rect x="110" y="150" width="230" height="140" rx="22" fill="#d9262b"/>
      <rect x="110" y="262" width="230" height="28" fill="#000" opacity=".18"/>
    </g>
    <g transform="rotate(10 260 240)">
      <rect x="150" y="180" width="230" height="140" rx="22" fill="#3b82f6"/>
      <rect x="150" y="292" width="230" height="28" fill="#000" opacity=".18"/>
    </g>
  </g>

  <!-- magnifying glass with play button -->
  <g filter="url(#shadow)">
    <line x1="352" y1="360" x2="440" y2="448" stroke="#f4f4f7" stroke-width="44" stroke-linecap="round"/>
    <circle cx="290" cy="298" r="108" fill="url(#lens)" stroke="#f4f4f7" stroke-width="26"/>
    <path d="M258 240 L258 356 L354 298 Z" fill="#fff" stroke="#fff" stroke-width="14" stroke-linejoin="round"/>
  </g>
</svg>
